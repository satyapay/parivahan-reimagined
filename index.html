  <script>
  (function(){
    var app=document.getElementById('app');

    var vehicles=[
      {id:'ka01',icon:'🚙',name:'Hyundai Creta',reg:'KA 01 MT 4582',year:'2021',fuel:'Petrol',state:'Karnataka',puc:'Expires 04 Sep',risk:'PUC due soon'},

    ];
    function load(){try{return Object.assign({},defaults,JSON.parse(localStorage.getItem('rr-transfer')||'{}'))}catch(e){return Object.assign({},defaults)}}

    function car(){return vehicles.filter(function(v){return v.id===state.selected})[0]||vehicles[0]}

    function transferModal(){var step=state.transferStep,c=car(),head='<div class="stepper"><div class="step '+(step===0?'active':'done')+'">1 · Readiness</div><div class="step '+(step===1?'active':step>1?'done':'')+'">2 · Buyer</div><div class="step '+(step===2?'active':'')+'">3 · Send invite</div></div>',body='',foot='';if(step===0){var carSelect='<div class="field"><label>Select Vehicle to Transfer</label><select class="input" onchange="state.selected=this.value;render()">'+vehicles.map(function(v){return '<option value="'+v.id+'" '+(v.id===state.selected?'selected':'')+'>'+v.name+' · '+v.reg+'</option>'}).join('')+'</select></div>';var challanPaid=c.id==='ka01'?state.challanPaid:true;body=carSelect+'<div class="notice info"><b>'+c.state+' mock route:</b> Remote identity verification is available. Final approval remains an RTO decision.</div><div class="checklist" style="margin-top:15px"><div class="checkrow"><div class="check">✓</div><div><b>Registered owner verified</b><span>Vehicle belongs to signed-in seller.</span></div></div><div class="checkrow '+(challanPaid?'':'warn')+'"><div class="check">'+(challanPaid?'✓':'!')+'</div><div><b>'+(challanPaid?'No outstanding challan':'One challan needs attention')+'</b><span>'+(challanPaid?'You can continue with transfer.':'Transfer can be drafted, but must be paid before submission.')+'</span></div></div><div class="checkrow"><div class="check">✓</div><div><b>Loan status clear</b><span>No active hypothecation on mock vehicle.</span></div></div><div class="checkrow"><div class="check">✓</div><div><b>Documents pre-checked</b><span>RC, insurance and PUC are in document wallet.</span></div></div></div>';foot='<button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="nextTransfer()">Continue to buyer →</button>'}else if(step===1){body='<div class="form-grid"><div class="field full"><label for="buyer-name">Buyer full name</label><input class="input" id="buyer-name" value="'+safe(     function kycModal(){var role=state.modal==='kyc-seller'?'seller':'buyer',name=role==='seller'?'Ananya':'Rohan',steps=[['Confirm consent','Read the transfer consent statement before continuing.'],['Face and liveness','Turn your face slightly left and right so we can confirm liveness.'],['Verify vehicle details',role==='seller'?'Show the RC and use the rear camera to confirm the vehicle number.':'Review vehicle details and confirm you agree to proceed.'],['Complete verification','Your verified consent will attach to this mock transfer application.']],item=steps[state.kycStep],bars='<div class="kyc-progress">'+steps.map(function(_,i){return '<i class="'+(i<=state.kycStep?'done':'')+'"></i>'}).join('')+'</div>';setTimeout(function(){var v=document.getElementById('webcam-feed');if(v){if(window.currentWebcamStream){v.srcObject=window.currentWebcamStream}else{navigator.mediaDevices.getUserMedia({video:true,audio:false}).then(function(s){window.currentWebcamStream=s;v.srcObject=s}).catch(function(e){console.warn('Webcam error:',e)})}}},100);return '<div class="backdrop" role="dialog" aria-modal="true"><section class="modal"><header class="modal-head"><div><h2>Remote verification</h2><p>'+ (role==='seller'?'Seller':'Buyer')+' session · about 3 minutes</p></div><button class="close" onclick="closeModal()" aria-label="Close">×</button></header><div class="modal-body"><div class="video"><div><video id="webcam-feed" autoplay muted playsinline style="width:100px;height:100px;object-fit:cover;border-radius:50%;border:4px solid rgba(255,255,255,.72);margin-bottom:13px;box-shadow:0 0 0 7px rgba(255,255,255,.16)"></video><b>'+name+' is on camera</b><span>Live secure verification session</span><div class="signal">Connection is good</div></div></div>'+bars+'<div class="instruction"><b>Step '+(state.kycStep+1)+' of 4 · '+item[0]+'</b><br>'+item[1]+'</div><div class="notice info" style="margin-top:12px">Using live local camera feed. No data leaves your device.</div></div><footer clas     function duplicateRcModal(){var step=state.dupRcStep||0,head='<div class="stepper"><div class="step '+(step===0?'active':'done')+'">1 · Reason</div><div class="step '+(step===1?'active':'')+'">2 · Payment</div></div>',body='',foot='';if(step===0){body='<div class="notice info"><b>No RTO visit required.</b> Your physical smart card will be mailed, and a digital RC will be available immediately.</div><div class="field" style="margin-top:15px"><label>Reason for duplicate</label><select class="input" id="dup-reason" onchange="document.getElementById(\'fir-div\').style.display=this.value!==\'torn\'?\'block\':\'none\';document.getElementById(\'upload-div\').style.display=this.value===\'torn\'?\'block\':\'none\'"><option value="lost">Lost</option><option value="stolen">Stolen</option><option value="torn">Torn / Mutilated</option></select></div><div class="field" id="fir-div"><label>Police FIR Number</label><input class="input" placeholder="e.g. FIR-1234-2026"></div><div class="field" id="upload-div" style="display:none"><label>Upload Torn RC Image</label><div style="border: 2px dashed #cbd5e1; padding: 20px; text-align: center; border-radius: 8px; color: #64748b; cursor: pointer; margin-top: 8px;" onclick="alertToast(\'Upload dialog\',\'Mock file picker opened.\')"><i style="font-size: 24px;">📷</i><br><span style="display: inline-block; margin-top: 8px; font-size: 14px;">Tap to upload photo of the torn RC</span></div></div>';foot='<button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="nextDupRc()">Continue to payment →</button>'}else{body='<div class="metrics"><div class="metric"><span>Service Fee</span><b>₹300</b></div><div class="metric"><span>Smart Card Fee</span><b>₹200</b></div><div class="metric"><span>Total Due</span><b style="color:var(--navy);font-size:15px">₹500</b></div></div><div class="notice success" style="margin-top:15px">Payment will be processed securely.</div>';foot='<button class="btn secondary" onclick="prevDupRc()">Back</button><button class="btn primary" onclick="payDupRc()">Pay ₹500 securely</button>'}return '<div class="backdrop" role="dialog" aria-modal="true"><section class="modal"><header class="modal-head"><div><h2>Duplicate RC</h2><p>'+car().reg+'</p></div><button class="close" onclick="closeModal()" aria-label="Close">×</button></header><div class="modal-body">'+head+body+'</div><footer class="modal-foot">'+foot+'</footer></section></div>'}

    function chatbot(){var fab='<div style="position:fixed;bottom:24px;right:24px;width:56px;height:56px;border-radius:50%;background:var(--blue);color:white;display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 8px 24px rgba(0,0,128,0.3);cursor:pointer;z-index:99" onclick="toggleChat()">💬</div>';if(!state.chatOpen)return fab;var msgs=state.chatHistory.map(function(m){var isBot=m.role==='bot';return '<div style="display:flex;margin-bottom:12px;justify-content:'+(isBot?'flex-start':'flex-end')+'"><div style="max-width:85%;padding:10px 14px;border-radius:12px;font-size:13px;line-height:1.4;background:'+(isBot?'#f1f5f9':'var(--blue)')+';color:'+(isBot?'var(--ink)':'white')+'">'+safe(m.text)+'</div></div>'}).join('');var chips=state.chatHistory.length===1?'<div style="display:flex;gap:8px;padding:0 16px 12px;overflow-x:auto;white-space:nowrap"><button class="chip" style="background:#fff;cursor:pointer;border-color:#cbd5e1" onclick="sendChat(\'Speeding fines\')">Speeding fines</button><button class="chip" style="background:#fff;cursor:pointer;border-color:#cbd5e1" onclick="sendChat(\'RC Transfer rules\')">RC Transfer rules</button></div>':'';var panel='<div style="position:fixed;bottom:90px;right:24px;width:340px;height:480px;background:white;border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,0.15);display:flex;flex-direction:column;z-index:99;overflow:hidden;border:1px solid var(--line)"><div style="background:var(--blue);color:white;padding:16px;display:flex;justify-content:space-between;align-items:center"><div><b style="display:block">Parivahan Sahayak</b><span style="font-size:11px;opacity:0.8">Official AI Assistant</span></div><button onclick="toggleChat()" style="background:none;border:none;color:white;font-size:20px;cursor:pointer">×</button></div><div id="chat-scroll" style="flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;">'+msgs+'</div>'+chips+'<div style="padding:12px 16px;border-top:1px solid var(--line);     window.beginLogin=function(){state.screen='auth';state.authStep='identity';render()};window.goHome=function(){state.screen='landing';render()};window.method=function(m){state.method=m;render()};window.authRole=function(r){state.authRole=r;render()};window.sendOtp=function(){state.authStep='otp';render()};window.verifyOtp=function(){var o=document.getElementById('otp');if(!o||o.value!=='123456'){notify('Try the demo OTP','Enter 123456 to continue.');return}state.role=state.authRole;state.screen='dashboard';state.active='overview';state.detail=false;if(state.role==='buyer'&&state.transfer.inviteSent&&!state.transfer.buyerAccepted){state.modal='buyer-invite'}save();render()};window.logout=function(){state.screen='landing';state.active='overview';render()};window.section=function(x){state.active=x;state.detail=false;render()};window.selectCar=function(id){state.selected=id;state.active='overview';state.detail=false;render()};window.showCar=function(id){state.selected=id;state.active='vehicles';state.detail=true;render()};window.backCars=function(){state.detail=false;render()};window.alertToast=function(a,b){notify(a,b)};window.openChallan=function(){state.challanStep=0;state.modal='challan';render()};window.contestChallan=function(){state.challanStep=1;render()};window.submitContest=function(){state.challanStatus='disputed';localStorage.setItem('rr-challan-status', 'disputed');state.modal='success';state.successTitle='Dispute Submitted';state.successBody='Your dispute has been forwarded to the Virtual Traffic Court. The payment deadline is frozen pending review.';save();render()};window.stopWebcam=function(){if(window.currentWebcamStream){window.currentWebcamStream.getTracks().forEach(function(t){t.stop()});window.currentWebcamStream=null}var v=document.getElementById('webcam-feed');if(v)v.srcObject=null};window.closeModal=function(){window.stopWebcam();state.modal=null;state.kycStep=0;render()};window.payChallan=function(){state.challanPaid=true;state.challanStatus='paid';localStorage.setItem('rr-challan', 'true');localStorage.setItem('rr-challan-status', 'paid');state.modal='success';state.successTitle='Challan payment complete';state.successBody='₹500 was paid in this mock flow. Receipt RR-CH-2048 is now in your payment history.';save();render()};window.openTransfer=function(){state.transferStep=0;state.modal='transfer';render()};window.nextTransfer=function(){if(state.transferStep===1){var n=document.getElementById('buyer-name'),m=document.getElementById('buyer-mobile');state.transfer.buyerName=n&&n.value.trim()?n.value.trim():'Rohan Shah';state.transfer.buyerMobile=m&&m.value.trim()?m.value.trim():'98 7654 3210'}state.transferStep=Math.min(2,state.transferStep+1);render()};window.prevTransfer=function(){state.transferStep=Math.max(0,state.transferStep-1);render()};window.sendInvite=function(){state.transfer.inviteSent=true;state.transfer.status='Waiting for buyer';state.modal='success';state.successTitle='Buyer invited securely';state.successBody=(state.transfer.buyerName||'Rohan Shah')+' can now review and accept transfer from their own dashboard.';save();render()};window.switchRole=function(r){state.role=r;state.active='transfers';state.detail=false;if(r==='buyer'&&state.transfer.inviteSent&&!state.transfer.buyerAccepted){state.modal='buyer-invite'}save();render()};window.buyerAccept=function(){state.transfer.buyerAccepted=true;state.transfer.status='Remote verification pending';state.modal='success';state.successTitle='Transfer accepted';state.successBody='You can now complete remote identity and consent verification.';save();render()};window.openBuyerInvite=function(){state.modal='buyer-invite';render()};window.rejectTransfer=function(){state.transfer=Object.assign({},defaults);state.transfer.status='Rejected by buyer';state.modal='success';state.successTitle='Transfer rejected';state.successBody='You have rejected the ownership transfer request.';save();render()};window.openKyc=function(r){state.modal=r==='seller'?'kyc-seller':'kyc-buyer';state.kycStep=0;render()};window.nextKyc=function(r){if(state.kycStep<3){state.kycStep+=1;render();return}window.stopWebcam();if(r==='seller')state.transfer.sellerKyc=true;else state.transfer.buyerKyc=true;if(state.transfer.sellerKyc&&state.transfer.buyerKyc){state.transfer.submitted=true;state.transfer.status='Under RTO review';state.successTitle='Remote verification complete';state.successBody='Both parties are verified. Transfer is submitted for mock Karnataka RTO review.'}else{state.transfer.status=state.transfer.buyerAccepted?'Remote verification pending':'Waiting for buyer';state.successTitle='Seller verification complete';state.successBody='Buyer will complete their own verification from their dashboard.'}state.modal='success';save();render()};window.resetTransfer=function(){state.transfer=Object.assign({},defaults);state.role='seller';save();notify('Demo reset','Ownership-transfer flow is ready to run again.')};window.openDuplicateRc=function(){state.dupRcStep=0;state.modal='duplicate-rc';render()};window.nextDupRc=function(){state.dupRcStep=1;render()};window.prevDupRc=function(){state.dupRcStep=0;render()};window.payDupRc=function(){state.modal='success';state.successTitle='Duplicate RC Request Submitted';state.successBody='₹500 paid. A digital duplicate RC is now available in your documents. The physical card will arrive in 7 days.';render()};window.toggleChat=function(){state.chatOpen=!state.chatOpen;render();if(state.chatOpen)setTimeout(function(){var c=document.getElementById('chat-scroll');if(c)c.scrollTop=c.scrollHeight},10)};window.sendChat=function(text){if(!text||!text.trim())return;var input=text.trim();var i=document.getElementById('chat-input');if(i)i.value='';state.chatHistory.push({role:'user',text:input});render();var c=document.getElementById('chat-scroll');if(c)c.scrollTop=c.scrollHeight;setTimeout(function(){var reply='I can assist you with Motor Vehicles Act queries and Parivahan services.';var lower=input.toLowerCase();if(lower.includes('fine')||lower.includes('challan')||lower.includes('speed')){reply='For speeding fines, you can view and pay your pending challans securely under the "Payments & challans" tab. You can also dispute a challan there through the Virtual Traffic Court.'}else if(lower.includes('transfer')||lower.includes('sell')||lower.includes('buy')){reply='To transfer vehicle ownership remotely, you need the RC, insurance, PUC, and digital Video KYC from both buyer and seller. You can initiate this in the "Transfers" tab.'}else if(lower.includes('license')||lower.includes('dl')){reply='Driving License services (like renewal or address change) require Aadhar-based e-KYC. A medical certificate (Form 1A) is mandatory if you are above 40 years of age.'}else if(lower.includes('rc')||lower.includes('registration')){reply='Your digital RC is always available under "My vehicles". If you lost your physical card, you can apply for a Duplicate RC directly from your vehicle dashboard.'}else if(lower.includes('hi')||lower.includes('hello')){reply='Namaste! I am Parivahan Sahayak. How can I help you with Indian motor vehicle rules today?'}state.chatHistory.push({role:'bot',text:reply});render();var c2=document.getElementById('chat-scroll');if(c2)c2.scrollTop=c2.scrollHeight}, 600)};render()
  }())
